[project]
name = "mavicer-blog-backend"
version = "0.1.0"
description = "FastAPI backend for Mavicer's Blog (1:1 with the original aleph-null.cc API)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlmodel>=0.0.21",
  "python-jose[cryptography]>=3.3.0",
  "argon2-cffi>=23.0.0",
  "python-multipart>=0.0.9",
  "pydantic[email-validator]>=2.8.0",
]

[tool.uv]
dev-dependencies = []
