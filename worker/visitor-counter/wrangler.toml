name = "mavicer-visitor-counter"
main = "worker.ts"
compatibility_date = "2024-09-23"

# D1 database binding — create the database first (see deploy steps below),
# then replace the database_id with your actual D1 database ID.
[[d1_databases]]
binding = "DB"
database_name = "mavicer-visitors"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Route: the worker will be accessible at mavicer.cc/api/visitor
# when deployed as a Pages Function or via a custom route.
# For standalone worker:
# routes = [{ pattern = "mavicer.cc/api/visitor", custom_domain = true }]

# For development with `wrangler dev`:
# The worker runs on localhost:8787 by default.
