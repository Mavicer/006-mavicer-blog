<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="keywords" content="personal blog, Mavicer, AI, NUAA" />
    <meta name="author" content="Mavicer" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/favicon.jpg" />
    <meta name="theme-color" content="#A31F34" />
    <!-- Apply the stored theme and start only the selected wallpaper before React. -->
    <script>
      try {
        const mode = localStorage.getItem("MAVICER_THEME_MODE") || "auto";
        const dark = mode === "dark" || (mode !== "light" && (new Date().getHours() < 6 || new Date().getHours() >= 18));
        document.documentElement.classList.toggle("dark", dark);
        const settings = JSON.parse(localStorage.getItem("MAVICER_APPEARANCE_V1") || "null");
        const paths = { default: ["/images/wallhaven-wqery6-light.webp", "/images/wallhaven-wqery6-dark.webp"], alpine: ["/images/backgrounds/alpine-day.webp", "/images/backgrounds/alpine-evening.webp"], reflection: ["/images/backgrounds/reflection-day.webp", "/images/backgrounds/reflection-evening.webp"] };
        const pair = Object.hasOwn(paths, settings?.background) ? paths[settings.background] : paths.default;
        const url = pair[dark ? 1 : 0];
        document.documentElement.style.setProperty("--personal-wallpaper", 'url("' + url + '")');
        const preload = document.createElement("link");
        preload.rel = "preload"; preload.as = "image"; preload.href = url;
        document.head.append(preload);
      } catch {}
    </script>
    <!-- Security headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net api.fontshare.com fonts.googleapis.com; font-src 'self' data: cdn.jsdelivr.net api.fontshare.com fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' api.github.com mavicer.cc;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <!-- FontAwesome 6 (matches original fa-* class names) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css"
    />
    <link id="hljs-light" rel="stylesheet" href="/vendor/highlight/github.min.css" disabled />
    <link id="hljs-dark" rel="stylesheet" href="/vendor/highlight/vs2015.min.css" disabled />
    <!-- Fonts are declared once in styles/fonts.css; avoid duplicate families
         and extra blocking Google/Fontshare stylesheets. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <title>Mavicer's Blog</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
